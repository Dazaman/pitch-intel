[project]
name = "pitch-intel-pipeline"
version = "0.1.0"
description = "Football intelligence data pipeline"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "libsql-experimental>=0.0.55",
    "soccerdata>=1.8",
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
pitch-intel = "pipeline.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
